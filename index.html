<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#000000">
  <meta name="description" content="Encrypt files with EIP-1581 domain keys derived on a physical Keycard.">
  <meta property="og:title" content="Encrypt Everything">
  <meta property="og:description" content="Your files. Your card. Your keys.">
  <meta property="og:type" content="website">
  <link rel="icon" href="favicon.png">
  <title>Encrypt Everything</title>
  <style>
    @font-face {
      font-family: "Inter";
      font-style: normal;
      font-weight: 400;
      font-display: swap;
      src: url("inter-regular.ttf") format("truetype");
    }

    @font-face {
      font-family: "Inter";
      font-style: normal;
      font-weight: 700;
      font-display: swap;
      src: url("inter-bold.ttf") format("truetype");
    }

    :root {
      color-scheme: dark;
      --canvas: #000;
      --text: #fff;
      --accent: #ff0178;
      --sans: "Inter", ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    * { box-sizing: border-box; }

    html, body { min-height: 100%; }

    body {
      margin: 0;
      background: var(--canvas);
      color: var(--text);
      font-family: var(--sans);
      -webkit-font-smoothing: antialiased;
    }

    .shell {
      min-height: 100svh;
      width: min(calc(100% - 64px), 1440px);
      margin: 0 auto;
      display: grid;
      place-items: center;
    }

    .hero {
      display: grid;
      width: 100%;
      grid-template-columns: minmax(0, 1fr) minmax(380px, 520px);
      align-items: center;
      gap: clamp(48px, 6vw, 104px);
      padding: 56px 0;
    }

    .copy { max-width: 820px; }

    .wordmark {
      display: block;
      width: min(100%, 760px);
      height: auto;
      margin: 0 0 30px;
    }

    .lede {
      max-width: 780px;
      margin: 0;
      color: var(--text);
      font-size: clamp(17px, 1.35vw, 21px);
      font-weight: 400;
      line-height: 1.42;
      letter-spacing: -0.01em;
    }

    .lede a {
      color: inherit;
      text-decoration-color: rgb(255 255 255 / 0.6);
      text-decoration-thickness: 1px;
      text-underline-offset: 3px;
    }

    .lede a:hover { color: var(--accent); }

    .actions {
      display: flex;
      align-items: center;
      gap: 28px;
      margin-top: 38px;
    }

    .button {
      min-height: 54px;
      padding: 0 28px;
      border: 0;
      border-radius: 999px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      color: var(--text);
      font-size: 16px;
      font-weight: 700;
      letter-spacing: -0.02em;
      text-decoration: none;
      transition: background 160ms ease;
    }

    .button:focus-visible { outline: 3px solid #fff; outline-offset: 4px; }
    .button.primary { background: var(--accent); }
    .button.primary:hover { background: #e9006e; }
    .button[aria-disabled="true"] { cursor: default; }
    .button[aria-disabled="true"]:hover { transform: none; background: #e9006e; }

    .release {
      display: inline-flex;
      align-items: center;
      gap: 12px;
      color: var(--text);
      font-size: 16px;
      font-weight: 700;
      white-space: nowrap;
    }

    .release img {
      width: 30px;
      height: 30px;
      filter: invert(1);
    }

    .portrait-wrap {
      justify-self: end;
      width: min(100%, 520px);
      aspect-ratio: 1;
      display: grid;
      place-items: center;
    }

    .portrait {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }

    @media (max-width: 760px) {
      .shell { width: min(calc(100% - 40px), 560px); }
      .hero {
        grid-template-columns: 1fr;
        gap: 24px;
        padding: 48px 0;
      }
      .copy { display: contents; }
      .copy h1 { grid-row: 2; }
      .wordmark { width: 100%; margin-bottom: 8px; }
      .portrait-wrap { grid-row: 1; justify-self: center; width: min(86vw, 420px); }
      .lede { grid-row: 3; font-size: 17px; }
      .actions { grid-row: 4; margin-top: 10px; gap: 18px; flex-wrap: wrap; }
    }

    @media (prefers-reduced-motion: reduce) {
      .button { transition: none; }
    }
  </style>
</head>
<body>
  <main class="shell">
    <section class="hero" aria-labelledby="hero-title">
      <div class="copy">
        <h1 id="hero-title" style="margin:0">
          <img class="wordmark" src="EE-logo.svg" alt="Encrypt Everything">
        </h1>
        <p class="lede">
          Files, photos, docs, zips — one <a href="https://keycard.tech">Keycard</a> tap and it's just a blob. Send it,
          store it, share it anywhere; tap again to decrypt.<br>
          Encrypted with <a href="https://eips.ethereum.org/EIPS/eip-1581">EIP-1581</a> domain keys derived on the card. No passwords, no
          keystore — external hardware only you control.
        </p>
        <div class="actions">
          <a class="button primary" href="https://xalisher.github.io/fdroid/repo/">Get it on F-Droid</a>
          <span class="release"><img src="github.svg" alt="">Alpha 0.1.0</span>
        </div>
      </div>

      <div class="portrait-wrap" aria-hidden="true">
        <img class="portrait" src="ee-icon.png" alt="">
      </div>
    </section>
  </main>
</body>
</html>
