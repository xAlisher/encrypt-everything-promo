<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#000000">
  <meta name="description" content="Encrypt Everything — private file encryption backed by a physical Keycard.">
  <meta property="og:title" content="Encrypt Everything">
  <meta property="og:description" content="Your files. Your card. Your keys.">
  <meta property="og:type" content="website">
  <link rel="icon" href="favicon.png">
  <title>Encrypt Everything</title>
  <style>
    :root {
      color-scheme: dark;
      --canvas: #000;
      --text: #fff;
      --muted: #a6a6a6;
      --line: #3a3a3a;
      --accent: #ff0178;
      --sans: Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    * { box-sizing: border-box; }

    html, body { min-height: 100%; }

    body {
      margin: 0;
      background: var(--canvas);
      color: var(--text);
      font-family: var(--sans);
      -webkit-font-smoothing: antialiased;
    }

    .shell {
      min-height: 100svh;
      width: min(100%, 1440px);
      margin: 0 auto;
      padding: clamp(28px, 4vw, 64px);
      display: grid;
      grid-template-rows: auto 1fr auto;
    }

    .mark {
      width: 64px;
      height: 64px;
      object-fit: contain;
      border-radius: 50%;
    }

    .hero {
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(320px, 0.82fr);
      align-items: center;
      gap: clamp(48px, 8vw, 128px);
      padding: clamp(56px, 8vh, 112px) 0;
    }

    .copy { max-width: 620px; }

    .wordmark {
      display: block;
      width: min(100%, 490px);
      height: auto;
      margin: 0 0 clamp(22px, 3vw, 36px);
    }

    .lede {
      max-width: 570px;
      margin: 0;
      color: var(--muted);
      font-size: clamp(17px, 1.55vw, 22px);
      line-height: 1.55;
      letter-spacing: -0.015em;
    }

    .lede strong { color: var(--text); font-weight: 650; }

    .actions {
      display: flex;
      align-items: center;
      gap: 14px;
      margin-top: 36px;
    }

    .button {
      min-height: 50px;
      padding: 0 24px;
      border: 1px solid var(--line);
      border-radius: 999px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      color: var(--text);
      font-size: 13px;
      font-weight: 800;
      letter-spacing: 0.08em;
      text-decoration: none;
      text-transform: uppercase;
      transition: transform 160ms ease, border-color 160ms ease, background 160ms ease;
    }

    .button:hover { transform: translateY(-2px); border-color: #777; }
    .button:focus-visible { outline: 3px solid #fff; outline-offset: 4px; }
    .button.primary { background: var(--accent); border-color: var(--accent); }
    .button.primary:hover { background: #e9006e; border-color: #e9006e; }
    .button[aria-disabled="true"] { cursor: default; }
    .button[aria-disabled="true"]:hover { transform: none; background: var(--accent); border-color: var(--accent); }

    .portrait-wrap {
      justify-self: end;
      width: min(100%, 500px);
      aspect-ratio: 1;
      display: grid;
      place-items: center;
    }

    .portrait {
      width: 100%;
      height: 100%;
      object-fit: contain;
      filter: drop-shadow(0 0 44px rgb(255 255 255 / 0.045));
    }

    footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 24px;
      color: #777;
      font-size: 12px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    footer a { color: #aaa; text-decoration: none; }
    footer a:hover { color: #fff; }

    @media (max-width: 760px) {
      .shell { padding: 24px; }
      .mark { width: 52px; height: 52px; }
      .hero {
        grid-template-columns: 1fr;
        gap: 18px;
        padding: 48px 0 64px;
      }
      .copy { display: contents; }
      .wordmark { grid-row: 1; width: min(100%, 420px); }
      .portrait-wrap { grid-row: 2; justify-self: center; width: min(84vw, 390px); }
      .lede { grid-row: 3; font-size: 17px; }
      .actions { grid-row: 4; margin-top: 18px; flex-direction: column; align-items: stretch; }
      .button { width: 100%; }
      footer { align-items: flex-start; flex-direction: column; gap: 8px; }
    }

    @media (prefers-reduced-motion: reduce) {
      .button { transition: none; }
    }
  </style>
</head>
<body>
  <main class="shell">
    <img class="mark" src="ee-icon.png" alt="Encrypt Everything">

    <section class="hero" aria-labelledby="hero-title">
      <div class="copy">
        <h1 id="hero-title" style="margin:0">
          <img class="wordmark" src="ee-title.png" alt="Encrypt Everything">
        </h1>
        <p class="lede">
          Files, photos, and documents—encrypted with keys derived from a
          <strong>physical Keycard</strong>. No cloud. No accounts. No compromise.
        </p>
        <div class="actions">
          <span class="button primary" aria-disabled="true">Coming soon</span>
          <a class="button" href="https://github.com/xAlisher/encrypt-everything-promo">GitHub</a>
        </div>
      </div>

      <div class="portrait-wrap" aria-hidden="true">
        <img class="portrait" src="ee-icon.png" alt="">
      </div>
    </section>

    <footer>
      <span>Your files. Your card. Your keys.</span>
      <a href="https://github.com/xAlisher/encrypt-everything-promo">Open source on GitHub</a>
    </footer>
  </main>
</body>
</html>
